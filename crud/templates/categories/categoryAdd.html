{% extends "layout/base.html" %}
{% block 'title' %} Add Category {% endblock 'title' %}
{% block 'content' %}
{% include "include/Toast.html"%}

<div class="p-6">

  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-[#1a3328] dark:text-white">Add Category</h1>
    <p class="text-sm text-[#6b6455] mt-0.5 dark:text-gray-500">Create a new inventory category</p>
  </div>

    <!-- Card -->
    <div class="max-w-3xl rounded-xl border border-[#d9cdb8] bg-[#f5f0e8] shadow-sm p-10 dark:bg-gray-800 dark:border-gray-800">

        <form action"#" method="POST">
        {% csrf_token %}

        <!-- Category Name -->
        <div class="mb-8">
            <label for="category_name" class="block text-xs font-semibold uppercase tracking-widest text-[#c9a84c] mb-3">
            Category Name
            </label>
            <input
            type="text"
            name="category_name"
            id="category_name"
            placeholder="e.g. Beverages"
            required
            class="w-full px-4 py-3 rounded-lg border border-[#d9cdb8] bg-white text-[#1a3328] text-sm placeholder-[#6b6455]/50 focus:outline-none focus:ring-2 focus:ring-[#1a3328] transition dark:bg-gray-900 dark:text-white dark:border-gray-700 dark:focus:ring-white dark:placeholder-slate-400"
            >
        </div>

        <!-- Divider -->
        <div class="border-t border-[#d9cdb8] mb-6"></div>

        <!-- Buttons -->
        <div class="flex items-center gap-3">
            <button type="submit" class="bg-[#c9a84c] text-[#1a1a1a] text-sm font-semibold px-5 py-2.5 rounded-lg hover:bg-[#b8922f] transition-all">
            Save Category
            </button>
        </div>

        </form>
    </div>

{% endblock 'content' %}
