{% include "include/Toast.html"%}

<!-- Add Category Modal -->
<div id="add-category-modal" class="hidden fixed inset-0 z-[99999] flex items-center justify-center">
  <div class="motion-preset-focus absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeAddCategoryModal()"></div>
  <div class="motion-preset-pop motion-duration-250 relative bg-[#f5f0e8] dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4 border border-[#d9cdb8] dark:border-gray-700">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-bold text-[#1a3328] dark:text-gray-100">
        <i class="fa-solid fa-tags mr-2 text-[#c9a84c]"></i>Add Category
      </h3>
      <button onclick="closeAddCategoryModal()" class="text-[#6b6455] dark:text-gray-400 hover:text-[#1a3328] dark:hover:text-gray-100 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Form -->
    <form id="add-category-form" method="POST" action="/category/add/">
      {% csrf_token %}

      <div class="grid grid-cols-1 gap-4">

        <!-- Category Name -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Category Name</label>
          <input type="text" name="category_name"
                 class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400"
                 placeholder="e.g. Beverages"/>

            <input type="hidden" name="next" value="category_list">
        </div>

      </div>

      <!-- Buttons -->
      <div class="flex gap-3 mt-6">
        <button type="button" onclick="closeAddCategoryModal()"
                class="flex-1 px-4 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 text-sm font-semibold text-[#6b6455] dark:text-gray-300 hover:bg-[#ede5d4] dark:hover:bg-gray-700 transition-all">
          Cancel
        </button>
        <button type="submit"
                class="flex-1 px-4 py-2 rounded-lg bg-[#c9a84c] text-[#1a1a1a] text-sm font-semibold hover:bg-[#b8922f] transition-all">
          Add Category
        </button>
      </div>

    </form>
  </div>
</div>

<!-- Edit Category Modal -->
<div id="edit-category-modal" class="hidden fixed inset-0 z-[99999] flex items-center justify-center">
  <div class="motion-preset-focus absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeEditCategoryModal()"></div>
  <div class="motion-preset-pop motion-duration-250 relative bg-[#f5f0e8] dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4 border border-[#d9cdb8] dark:border-gray-700">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-bold text-[#1a3328] dark:text-gray-100">
        <i class="fa-solid fa-pen-to-square mr-2 text-[#c9a84c]"></i>Edit Category
      </h3>
      <button onclick="closeEditCategoryModal()" class="text-[#6b6455] dark:text-gray-400 hover:text-[#1a3328] dark:hover:text-gray-100 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Form -->
    <form id="edit-category-form" method="POST" action="#">
      {% csrf_token %}

      <div class="grid grid-cols-1 gap-4">

        <!-- Category Name -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Category Name</label>
          <input type="text" id="edit-category-name" name="category_name"
                 class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400"/>
        </div>

      </div>

      <!-- Buttons -->
      <div class="flex gap-3 mt-6">
        <button type="button" onclick="closeEditCategoryModal()"
                class="flex-1 px-4 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 text-sm font-semibold text-[#6b6455] dark:text-gray-300 hover:bg-[#ede5d4] dark:hover:bg-gray-700 transition-all">
          Cancel
        </button>
        <button type="submit"
                class="flex-1 px-4 py-2 rounded-lg bg-[#c9a84c] text-[#1a1a1a] text-sm font-semibold hover:bg-[#b8922f] transition-all">
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
