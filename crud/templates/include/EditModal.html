{% include "include/Toast.html"%}

{% load static %} <!-- ini man -->

{% block 'js' %}
  <script src="{% static 'js/validation.js' %}"></script>
{% endblock 'js' %} <!-- indi pag e remove -->

<div id="edit-modal" class="hidden fixed inset-0 z-[99999] flex items-center justify-center">
  <div class="motion-preset-focus absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeEditModal()"></div>
  <div class="motion-preset-pop motion-duration-250 relative bg-[#f5f0e8] dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-lg mx-4 border border-[#d9cdb8] dark:border-gray-700">
    
    

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-bold text-[#1a3328] dark:text-gray-100">
        <i class="fa-solid fa-pen-to-square mr-2 text-[#c9a84c]"></i>Edit Item
      </h3>
      <button onclick="closeEditModal()" class="text-[#6b6455] dark:text-gray-400 hover:text-[#1a3328] dark:hover:text-gray-100 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Form -->
    <form id="edit-form" method="POST" action="#">
      {% csrf_token %}

      <div class="grid grid-cols-2 gap-4">

        <!-- Item Name -->
        <div class="col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Item Name</label>
          <input type="text" id="edit-item-name" name="item_name"
                 class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400"/>
        </div>

        <!-- Category -->
        <div class="col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Category</label>
          <select id="edit-category" name="category"
                  class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400">
            {% for category in categories %}
            <option value="{{ category.category_id }}">{{ category.category_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Unit -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Unit</label>
          <select id="edit-unit" name="unit"
                  class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400 appearance-none">
            <option value="" disabled>Select a unit</option>
            <option value="kg">kg (Kilograms)</option>
            <option value="g">g (Grams)</option>
            <option value="ml">ml (Milliliters)</option>
            <option value="liters">liters (Liters)</option>
            <option value="pcs">pcs (Pieces)</option>
            <option value="packs">packs (Packs)</option>
            <option value="boxes">boxes (Boxes)</option>
            <option value="bottles">bottles (Bottles)</option>
          </select>
        </div>

        <!-- Current Stock -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Current Stock</label>
          <input type="number" id="edit-current-stock" name="current_stock"
                 class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400"/>
        </div>

        <!-- Reorder Level -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Reorder Level</label>
          <input type="number" id="edit-reorder-level" name="reorder_level"
                 class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] bg-white text-[#1a3328] text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:bg-gray-900 dark:text-white"/>
          <p id="edit-reorder-error" class="hidden text-xs mt-1 text-red-500">Reorder level must be at least 10!</p>
        </div>

        <!-- Unit Cost -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-[#c9a84c] mb-1">Unit Cost (₱)</label>
          <input type="number" step="0.01" id="edit-unit-cost" name="unit_cost"
                 class="w-full px-3 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-900 text-[#1a3328] dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a3328]/30 dark:focus:ring-gray-400"/>
          <p id="edit-cost-error" class="hidden text-xs mt-1 text-red-500">Unit cost must be greater than 0!</p>
        </div>

      </div>

      <!-- Buttons -->
      <div class="flex gap-3 mt-6">
        <button type="button" onclick="closeEditModal()"
                class="flex-1 px-4 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 text-sm font-semibold text-[#6b6455] dark:text-gray-300 hover:bg-[#ede5d4] dark:hover:bg-gray-700 transition-all">
          Cancel
        </button>
        <button type="submit"
                class="flex-1 px-4 py-2 rounded-lg bg-[#c9a84c] text-[#1a1a1a] text-sm font-semibold hover:bg-[#b8922f] transition-all">
          Save Changes
        </button>
      </div>

    </form>
  </div>
</div>
