{% include "include/Toast.html"%}

<div id="delete-modal" class="hidden fixed inset-0 z-[99999] flex items-center justify-center">
  <div class="motion-preset-focus absolute inset-0 bg-black/50 backdrop-blur-sm"
       onclick="closeDeleteModal()"></div>
  <div class="motion-preset-pop motion-duration-250 relative bg-[#f5f0e8] dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4 border border-[#d9cdb8] dark:border-gray-700">

    <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mx-auto mb-4">
      <i class="fa-solid fa-trash text-red-600 text-lg"></i>
    </div>

    <h3 class="text-center text-lg font-bold text-[#1a3328] dark:text-gray-100 mb-1">
      Delete Item
    </h3>

    <p class="text-center text-sm text-[#6b6455] dark:text-gray-400 mb-6">
      Are you sure you want to delete
      <span id="delete-item-name" class="font-semibold text-[#1a3328] dark:text-gray-100"></span>?
      This action cannot be undone.
    </p>

    <form id="delete-form" method="POST" action="">
      {% csrf_token %}
      <div class="flex gap-3">
        <button type="button" onclick="closeDeleteModal()"
                class="flex-1 px-4 py-2 rounded-lg border border-[#d9cdb8] dark:border-gray-700 text-sm font-semibold text-[#6b6455] dark:text-gray-300 hover:bg-[#ede5d4] dark:hover:bg-gray-700 transition-all">
          Cancel
        </button>
        <button type="submit"
                class="flex-1 px-4 py-2 rounded-lg bg-red-600 text-white text-sm font-semibold hover:bg-red-700 transition-all">
          Delete
        </button>
      </div>
    </form>

  </div>
</div>
