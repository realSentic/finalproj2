{% load static %}

{% block 'js' %}
  <script src="{% static 'js/supp.js' %}"></script>
{% endblock 'js' %}

<!-- Edit Supplier Modal -->
<div id="editSupplierModal" class="motion-preset-focus hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
  <div class="motion-preset-pop motion-duration-250 bg-[#f5f0e8] dark:bg-gray-900 rounded-xl shadow-2xl w-full max-w-md mx-4 border border-[#d9cdb8] dark:border-gray-700">

    <div class="flex items-center justify-between px-6 py-4 border-b border-[#d9cdb8] dark:border-gray-700">
      <h2 class="text-sm font-bold text-[#1a3328] dark:text-gray-100 uppercase tracking-wide">Edit Supplier</h2>
      <button onclick="closeEditSupplierModal()" class="text-[#6b6455] dark:text-gray-400 hover:text-[#1a3328] dark:hover:text-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 384 512">
          <path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256l105.3-105.4z"/>
        </svg>
      </button>
    </div>

    <form id="editSupplierForm" method="POST" action="{% url 'update_supplier' 0 %}">
      {% csrf_token %}
      <div class="px-6 py-5 space-y-4">

        <div>
            <label class="block text-xs font-semibold text-[#1a3328] dark:text-gray-300 mb-1 uppercase tracking-wide">Supplier Name <span class="text-red-500">*</span></label>
            <input type="text" name="supplier_name" id="edit_supplier_name" class="w-full px-3 py-2 text-sm rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-800 text-[#1a3328] dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-[#1a3328] dark:focus:ring-gray-400 transition-all" required>
            <p id="edit-name-error" class="hidden text-xs mt-1 text-red-500">Supplier name is required.</p>
        </div>

        <div>
            <label class="block text-xs font-semibold text-[#1a3328] dark:text-gray-300 mb-1 uppercase tracking-wide">Contact Person</label>
            <input type="text" name="contact_person" id="edit_contact_person" class="w-full px-3 py-2 text-sm rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-800 text-[#1a3328] dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-[#1a3328] dark:focus:ring-gray-400 transition-all">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#1a3328] dark:text-gray-300 mb-1 uppercase tracking-wide">Email</label>
            <input type="email" name="email" id="edit_email" class="w-full px-3 py-2 text-sm rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-800 text-[#1a3328] dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-[#1a3328] dark:focus:ring-gray-400 transition-all">
            <p id="edit-email-error" class="hidden text-xs mt-1 text-red-500">Please enter a valid email.</p>
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#1a3328] dark:text-gray-300 mb-1 uppercase tracking-wide">Phone</label>
            <input type="text" name="phone_number" id="edit_phone_number" class="w-full px-3 py-2 text-sm rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-800 text-[#1a3328] dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-[#1a3328] dark:focus:ring-gray-400 transition-all">
            <p id="edit-phone-error" class="hidden text-xs mt-1 text-red-500">Please enter a valid phone number.</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#1a3328] dark:text-gray-300 mb-1 uppercase tracking-wide">Address</label>
          <input type="text" name="address" id="edit_address"
            class="w-full px-3 py-2 text-sm rounded-lg border border-[#d9cdb8] dark:border-gray-700 bg-white dark:bg-gray-800 text-[#1a3328] dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-[#1a3328] dark:focus:ring-gray-400 transition-all">
        </div>

      </div>

      <div class="flex justify-end gap-2 px-6 py-4 border-t border-[#d9cdb8] dark:border-gray-700">
        <button type="button" onclick="closeEditSupplierModal()"
          class="px-4 py-2 text-xs font-semibold rounded-lg border border-[#d9cdb8] dark:border-gray-700 text-[#6b6455] dark:text-gray-300 bg-[#f5f0e8] dark:bg-gray-800 hover:bg-[#ede5d4] dark:hover:bg-gray-700 transition-all">
          Cancel
        </button>
        <button type="submit"
          class="px-4 py-2 text-xs font-semibold rounded-lg bg-[#1a3328] dark:bg-[#c9a84c] text-white dark:text-[#1a1a1a] hover:bg-[#2b4b3d] dark:hover:bg-[#b8922f] transition-all">
          Save Changes
        </button>
      </div>
    </form>

  </div>
</div>
